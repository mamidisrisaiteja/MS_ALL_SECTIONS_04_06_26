services:


  configserver:
    image: "mamidisrisaiteja/configserver:s9"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    extends:
      file: common-config.yml
      service: microservice-base-config
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8071/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  eurekaserver:
    image: "mamidisrisaiteja/eurekaserver:s9"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8070/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"


  accounts:
    image: "mamidisrisaiteja/accounts:s9"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
     - configserver
    environment:
      SPRING_APPLICATION_NAME: "accounts"

    extends:
      file: common-config.yml
      service: microservice-eureka-config


  loans:
    image: "mamidisrisaiteja/loans:s9"
    container_name: loans-ms
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      - configserver


    environment:
      SPRING_APPLICATION_NAME: "loans"

    extends:
      file: common-config.yml
      service: microservice-eureka-config

  loans1:
      image: "mamidisrisaiteja/loans:s9"
      container_name: loans-ms1
      ports:
        - "8091:8090"
      restart: always
      depends_on:
        - configserver


      environment:
        SPRING_APPLICATION_NAME: "loans"

      extends:
        file: common-config.yml
        service: microservice-eureka-config


  cards:
    image: "mamidisrisaiteja/cards:s9"
    container_name: cards-ms
    ports:
      - "9000:9000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      - configserver

    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  gatewayserver:
    image: "mamidisrisaiteja/gatewayserver:s9"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    restart: always
    depends_on:
      accounts:
        condition: service_healthy
      loans:
        condition: service_healthy
      cards:
        condition: service_healthy

    environment:
      SPRING_APPLICATION_NAME: "gatewayserver"
    extends:
      file: common-config.yml
      service: microservice-eureka-config


networks:
  eazybank:
    driver: "bridge"



